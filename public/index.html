<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MotoCare - Rawat Motor. Nikmati Perjalanan</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0C1014">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        darkBase: '#0C1014',
                        cardBase: '#151D22',
                        goldAccent: '#DEC99F',
                        goldSubtle: '#D8BF8D',
                        goldLight: '#E2C995',
                        textPrimary: '#F5F3EE',
                        textMuted: '#ADB6B8',
                        tealGlow: '#476A68',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            background-color: #070A0D;
            color: #F5F3EE;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            user-select: none;
        }

        /* Ambient Glow Circles matching the exact Figma SVG parameters */
        .ambient-glow {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            border-radius: 9999px;
        }
        .glow-top-right {
            top: 50px;
            right: -60px;
            width: 260px;
            height: 260px;
            background: rgba(216, 191, 141, 0.16);
            filter: blur(80px);
        }
        .glow-mid-left {
            top: 420px;
            left: -100px;
            width: 330px;
            height: 330px;
            background: rgba(71, 106, 104, 0.30);
            filter: blur(90px);
        }
        .glow-bottom-right {
            bottom: 50px;
            right: -40px;
            width: 230px;
            height: 230px;
            background: rgba(216, 191, 141, 0.085);
            filter: blur(80px);
        }

        /* Glassmorphism Card Utilities */
        .glass-card {
            background: linear-gradient(135deg, rgba(228, 236, 231, 0.12) 0%, rgba(228, 236, 231, 0.025) 100%);
            border: 1px solid rgba(228, 236, 231, 0.1568);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .gold-card {
            background: linear-gradient(135deg, rgba(216, 191, 141, 0.15) 0%, rgba(216, 191, 141, 0.025) 100%);
            border: 1px solid rgba(222, 201, 159, 0.30);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-pill-active {
            background: rgba(216, 191, 141, 0.14) !important;
            border: 1px solid rgba(216, 191, 141, 0.25) !important;
            color: #E2C995 !important;
        }

        /* Page Transitions */
        #app-content {
            transition: opacity 0.15s ease-in-out;
        }
        .page-fade-out {
            opacity: 0;
        }
        .page-fade-in {
            opacity: 1;
        }

        /* Scrollbar hide */
        ::-webkit-scrollbar {
            display: none;
        }
        body, main {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#070A0D]">

    <!-- App Mobile Frame (Width max 390px exact to Figma SVG) -->
    <div class="w-full max-w-[390px] min-h-screen bg-[#0C1014] relative flex flex-col shadow-2xl overflow-hidden mx-auto">
        
        <!-- Ambient Atmospheric Background Lights -->
        <div class="ambient-glow glow-top-right"></div>
        <div class="ambient-glow glow-mid-left"></div>
        <div class="ambient-glow glow-bottom-right"></div>

        <!-- Simulated Mobile Status Bar (9:41, Cellular, Wifi, Battery) -->
        <header class="w-full px-5 pt-3 pb-1 flex justify-between items-center text-xs text-[#F5F3EE] font-medium z-20 select-none">
            <span class="tracking-tight text-sm font-semibold">9:41</span>
            <div class="flex items-center space-x-1.5">
                <!-- Signal Bars -->
                <svg class="w-4 h-3 fill-current" viewBox="0 0 16 12">
                    <rect x="0" y="8" width="2.5" height="4" rx="0.5"/>
                    <rect x="4" y="5" width="2.5" height="7" rx="0.5"/>
                    <rect x="8" y="2" width="2.5" height="10" rx="0.5"/>
                    <rect x="12" y="0" width="2.5" height="12" rx="0.5"/>
                </svg>
                <!-- Wi-Fi -->
                <svg class="w-4 h-3 fill-none stroke-current" stroke-width="1.6" stroke-linecap="round" viewBox="0 0 16 12">
                    <path d="M1 2.5C5.5 -0.5 10.5 -0.5 15 2.5"/>
                    <path d="M3.5 5.5C6.5 3.5 9.5 3.5 12.5 5.5"/>
                    <path d="M6 8.5C7.2 7.7 8.8 7.7 10 8.5"/>
                    <circle cx="8" cy="11" r="0.8" fill="currentColor"/>
                </svg>
                <!-- Battery -->
                <div class="w-5 h-2.5 border border-[#F5F3EE] rounded-sm p-0.5 flex items-center relative ml-0.5">
                    <div class="h-full w-full bg-[#F5F3EE] rounded-[1px]"></div>
                    <div class="w-0.5 h-1 bg-[#F5F3EE] absolute -right-1 rounded-r-xs"></div>
                </div>
            </div>
        </header>

        <!-- Area Konten Utama Aplikasi (Rendered via SPA Router in app.js) -->
        <main id="app-content" class="flex-1 px-5 pt-3 pb-28 z-10 overflow-y-auto">
            <!-- Loading indicator default -->
            <div class="flex flex-col items-center justify-center min-h-[50vh] space-y-3">
                <div class="w-8 h-8 border-2 border-[#DEC99F] border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-[#ADB6B8]">Memuat MotoCare...</p>
            </div>
        </main>

        <!-- Floating Bottom Navigation Bar (Width 350px, Height 76px, rx 24px) -->
        <nav id="bottom-nav" class="fixed bottom-4 left-0 right-0 w-full max-w-[390px] mx-auto px-5 z-40 pointer-events-none">
            <div class="pointer-events-auto bg-[#151D22]/85 backdrop-blur-xl border border-[#E4ECE7]/15 rounded-[24px] h-[72px] px-2 flex items-center justify-around shadow-2xl">
                <!-- Tab Riwayat -->
                <a href="#/riwayat" id="nav-riwayat" class="nav-btn transition-all duration-200 flex flex-col items-center justify-center text-xs h-[52px]">
                    <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                    <span class="text-[11px] font-medium leading-none">Riwayat</span>
                </a>

                <!-- Tab Katalog -->
                <a href="#/katalog" id="nav-katalog" class="nav-btn transition-all duration-200 flex flex-col items-center justify-center text-xs h-[52px]">
                    <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                    </svg>
                    <span class="text-[11px] font-medium leading-none">Katalog</span>
                </a>

                <!-- Tab Profil -->
                <a href="#/profil" id="nav-profil" class="nav-btn transition-all duration-200 flex flex-col items-center justify-center text-xs h-[52px]">
                    <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span class="text-[11px] font-medium leading-none">Profil</span>
                </a>
            </div>
        </nav>

        <!-- Container Bottom Sheet / Filter Modal -->
        <div id="modal-container"></div>

    </div>

    <!-- Script SPA MotoCare -->
    <script src="app.js?v=7.0"></script>
</body>
</html>
