<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MotoCare - Rawat Motor. Nikmati Perjalanan</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0C1014">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        darkBase: '#0C1014',
                        cardBase: '#151D22',
                        goldAccent: '#DEC99F',
                        goldSubtle: '#D8BF8D',
                        goldLight: '#E2C995',
                        textPrimary: '#F5F3EE',
                        textMuted: '#ADB6B8',
                        tealGlow: '#476A68',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            background-color: #070A0D;
            color: #F5F3EE;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            user-select: none;
        }

        /* Ambient Glow Circles matching the exact Figma SVG parameters */
        .ambient-glow {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            border-radius: 9999px;
        }
        .glow-top-right {
            top: 50px;
            right: -60px;
            width: 260px;
            height: 260px;
            background: rgba(216, 191, 141, 0.16);
            filter: blur(80px);
        }
        .glow-mid-left {
            top: 420px;
            left: -100px;
            width: 330px;
            height: 330px;
            background: rgba(71, 106, 104, 0.30);
            filter: blur(90px);
        }
        .glow-bottom-right {
            bottom: 50px;
            right: -40px;
            width: 230px;
            height: 230px;
            background: rgba(216, 191, 141, 0.085);
            filter: blur(80px);
        }

        /* Glassmorphism Card Utilities */
        .glass-card {
            background: linear-gradient(135deg, rgba(228, 236, 231, 0.12) 0%, rgba(228, 236, 231, 0.025) 100%);
            border: 1px solid rgba(228, 236, 231, 0.1568);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .gold-card {
            background: linear-gradient(135deg, rgba(216, 191, 141, 0.15) 0%, rgba(216, 191, 141, 0.025) 100%);
            border: 1px solid rgba(222, 201, 159, 0.30);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-pill-active {
            background: rgba(216, 191, 141, 0.14) !important;
            border: 1px solid rgba(216, 191, 141, 0.25) !important;
            color: #E2C995 !important;
        }

        /* Page Transitions */
        #app-content {
            transition: opacity 0.15s ease-in-out;
        }
        .page-fade-out {
            opacity: 0;
        }
        .page-fade-in {
            opacity: 1;
        }

        /* Hide native scrollbars while keeping smooth drag & wheel scroll */
        ::-webkit-scrollbar {
            display: none;
        }
        body, main, .h-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .h-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }
        .h-scroll:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-[#070A0D]">

    <!-- App Mobile Frame (Width max 390px exact to Figma SVG) -->
    <div class="w-full max-w-[390px] min-h-screen bg-[#0C1014] relative flex flex-col shadow-2xl overflow-hidden mx-auto">
        
        <!-- Ambient Atmospheric Background Lights -->
        <div class="ambient-glow glow-top-right"></div>
        <div class="ambient-glow glow-mid-left"></div>
        <div class="ambient-glow glow-bottom-right"></div>

        <!-- Area Konten Utama Aplikasi (Rendered via SPA Router in app.js) -->
        <main id="app-content" class="flex-1 px-5 pt-11 pb-28 z-10 overflow-y-auto">
            <!-- Loading indicator default -->
            <div class="flex flex-col items-center justify-center min-h-[50vh] space-y-3">
                <div class="w-8 h-8 border-2 border-[#DEC99F] border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-[#ADB6B8]">Memuat MotoCare...</p>
            </div>
        </main>

        <!-- Floating Bottom Navigation Bar (5 Halaman Utama) -->
        <nav id="bottom-nav" class="fixed bottom-4 left-0 right-0 w-full max-w-[390px] mx-auto px-4 z-40 pointer-events-none">
            <div class="pointer-events-auto bg-[#151D22]/90 backdrop-blur-xl border border-[#E4ECE7]/15 rounded-[24px] h-[72px] px-1.5 flex items-center justify-between shadow-2xl">
                <!-- 1. Tab Riwayat -->
                <a href="#/riwayat" id="nav-riwayat" class="nav-btn transition-all duration-200 flex flex-col items-center justify-center text-xs h-[52px]">
                    <svg class="w-4 h-4 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Riwayat</span>
                </a>

                <!-- 2. Tab Garasi (Multi-Motor) -->
                <a href="#/garasi" id="nav-garasi" class="nav-btn transition-all duration-200 flex flex-col items-center justify-center text-xs h-[52px]">
                    <svg class="w-4 h-4 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="5.5" cy="17.5" r="3.5"/>
                        <circle cx="18.5" cy="17.5" r="3.5"/>
                        <path d="M15 6h3l2 5h-5l-3-5H8l-2.5 6.5"/>
                        <path d="M9 17.5h6"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Garasi</span>
                </a>

                <!-- 3. Tab Katalog -->
                <a href="#/katalog" id="nav-katalog" class="nav-btn transition-all duration-200 flex flex-col items-center justify-center text-xs h-[52px]">
                    <svg class="w-4 h-4 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Katalog</span>
                </a>

                <!-- 4. Tab Bengkel -->
                <a href="#/bengkel" id="nav-bengkel" class="nav-btn transition-all duration-200 flex flex-col items-center justify-center text-xs h-[52px]">
                    <svg class="w-4 h-4 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Bengkel</span>
                </a>

                <!-- 5. Tab Profil -->
                <a href="#/profil" id="nav-profil" class="nav-btn transition-all duration-200 flex flex-col items-center justify-center text-xs h-[52px]">
                    <svg class="w-4 h-4 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span class="text-[10px] font-medium leading-none">Profil</span>
                </a>
            </div>
        </nav>

        <!-- Container Bottom Sheet / Filter Modal -->
        <div id="modal-container"></div>

    </div>

    <!-- Script SPA MotoCare -->
    <script src="app.js?v=15.0"></script>
</body>
</html>
